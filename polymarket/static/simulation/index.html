<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulation — BTC 5-Minute Strategy Board</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <header class="nav-bar">
      <nav class="nav">
        <a class="nav__brand" href="/">BTC <span>5m</span></a>
        <div class="nav__links">
          <a class="nav__link" href="/">Home</a>
          <a class="nav__link" href="/board">Board</a>
          <a class="nav__link" href="/leaderboard">Leaderboard</a>
          <a class="nav__link nav__link--active" href="/simulation">Simulation</a>
        </div>
      </nav>
    </header>

    <main class="shell">
      <p class="page-title">Simulation — Replaying a 5-min BTC window</p>

      <div class="sim-controls">
        <button type="button" id="sim-play" disabled>Play</button>
        <button type="button" id="sim-new">New window</button>
        <span class="sim-controls__label" id="sim-label">loading…</span>
        <input type="range" id="sim-scrub" min="0" max="0" value="0" />
        <span class="sim-controls__label" id="sim-source" hidden></span>
      </div>

      <section class="market-embed" id="market">
        <div class="market-embed__top">
          <div class="market-embed__left">
            <span class="status-dot status-dot--live" id="status-dot"></span>
            <span class="market-embed__label" id="market-label">Simulation</span>
          </div>
          <div class="market-embed__meta">
            <span class="market-embed__meta-item" id="meta-strike">Strike —</span>
            <span class="market-embed__meta-item" id="meta-clock">—:— left</span>
          </div>
        </div>

        <div class="outcome-cards">
          <div class="outcome-card outcome-card--up" id="card-up">
            <div class="outcome-card__head">
              <span class="outcome-card__name">▲ Up</span>
              <span class="outcome-card__chance" id="up-chance">—</span>
            </div>
            <div class="outcome-card__quotes">
              <div class="outcome-card__quote">
                <span class="outcome-card__quote-label">Buy</span>
                <span class="outcome-card__quote-value" id="up-buy">—</span>
              </div>
              <div class="outcome-card__quote">
                <span class="outcome-card__quote-label">Sell</span>
                <span class="outcome-card__quote-value" id="up-sell">—</span>
              </div>
            </div>
          </div>
          <div class="outcome-card outcome-card--down" id="card-down">
            <div class="outcome-card__head">
              <span class="outcome-card__name">▼ Down</span>
              <span class="outcome-card__chance" id="down-chance">—</span>
            </div>
            <div class="outcome-card__quotes">
              <div class="outcome-card__quote">
                <span class="outcome-card__quote-label">Buy</span>
                <span class="outcome-card__quote-value" id="down-buy">—</span>
              </div>
              <div class="outcome-card__quote">
                <span class="outcome-card__quote-label">Sell</span>
                <span class="outcome-card__quote-value" id="down-sell">—</span>
              </div>
            </div>
          </div>
        </div>

        <div class="price-chart">
          <div class="price-chart__header">
            <div>
              <div class="price-chart__label">BTC / USD · replay</div>
              <div class="price-chart__subline" id="chart-range">waiting…</div>
            </div>
            <div class="price-chart__readout">
              <div class="price-chart__value" id="chart-price">—</div>
              <div class="price-chart__delta" id="chart-delta">—</div>
            </div>
          </div>
          <div class="price-chart__canvas" id="chart"></div>
          <div class="price-chart__footer">
            <span id="chart-open">open —</span>
            <span class="price-chart__footer-strike" id="chart-strike">strike —</span>
            <span id="chart-verdict">—</span>
          </div>
        </div>

        <div class="market-embed__stats">
          <div class="market-embed__stat">
            <span class="market-embed__stat-label">BTC price</span>
            <span class="market-embed__stat-value" id="stat-price">—</span>
          </div>
          <div class="market-embed__stat">
            <span class="market-embed__stat-label">Price to beat</span>
            <span class="market-embed__stat-value" id="stat-strike">—</span>
          </div>
          <div class="market-embed__stat">
            <span class="market-embed__stat-label">Window high</span>
            <span class="market-embed__stat-value" id="stat-high">—</span>
          </div>
          <div class="market-embed__stat">
            <span class="market-embed__stat-label">Window low</span>
            <span class="market-embed__stat-value" id="stat-low">—</span>
          </div>
        </div>
      </section>

      <div class="board" id="spatial-board" aria-label="Strategy board"></div>

      <section class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Strategies at this tick</h2>
          <span class="panel__subtitle" id="strategy-count"></span>
        </div>
        <div class="explainer" id="strategies"></div>
      </section>
    </main>

    <script src="/js/core.js"></script>
    <script src="/js/simulation.js"></script>
  </body>
</html>
